<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional Binance spot K-line terminal with synthetic pair support" />
    <title>PairAny — Binance Terminal</title>
    <script>
      // Apply the persisted theme before first paint (Appica's ThemeScript
      // only runs after React mounts — without this, dark-mode users get a
      // white flash on every load).
      try {
        var t = localStorage.getItem('pairany-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      } catch (e) {
        var dark = matchMedia('(prefers-color-scheme: dark)').matches
      }
      document.documentElement.classList.add(dark ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This trading terminal requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
